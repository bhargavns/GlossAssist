version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./database/init:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
    volumes:
      - ./backend:/app
      - /app/node_modules  # Anonymous volume for node_modules
    ports:
      - "5001:5000"
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:5001}
      REACT_APP_USER_STUDY_MODE: ${REACT_APP_USER_STUDY_MODE:-false}
      REACT_APP_STUDY_LANG_NO_PRED: ${REACT_APP_STUDY_LANG_NO_PRED:-Study_NoPred}
      REACT_APP_STUDY_LANG_WITH_PRED: ${REACT_APP_STUDY_LANG_WITH_PRED:-Study_WithPred}
      REACT_APP_ENABLE_INFERENCE: ${REACT_APP_ENABLE_INFERENCE:-false}
      CHOKIDAR_USEPOLLING: true  # For file watching on Mac
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Anonymous volume for node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    stdin_open: true  # Keep STDIN open for React

  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

  tests:
    image: node:lts-alpine
    working_dir: /app
    command: ["node", "scripts/compose-smoke-tests.mjs"]
    volumes:
      - ./:/app:ro
    depends_on:
      - backend
      - frontend
    restart: "no"

volumes:
  postgres_data: